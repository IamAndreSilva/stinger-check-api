apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backups
spec:
  accessModes: [ "ReadWriteOnce" ]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
spec:
  schedule: "15 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-dump
              image: postgres:16
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: stinger-check-secrets
                      key: POSTGRES_PASSWORD
                - name: RETENTION_DAYS
                  value: "7"
              command:
                - /bin/bash
                - -euo
                - pipefail
                - -c
                - |
                  target=/backups/stingercheck-$(date +%F).sql.gz
                  pg_dump -h postgres -U postgres stingercheck | gzip > "$target.tmp"
                  mv "$target.tmp" "$target"
                  find /backups -name '*.sql.gz' -mtime +"$RETENTION_DAYS" -delete
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: postgres-backups
