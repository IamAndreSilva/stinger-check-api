apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: stinger-check

resources:
  - namespace.yaml
  - postgres.yaml
  - redis.yaml
  - api.yaml
  - ui.yaml
  - backup.yaml

configMapGenerator:
  - name: api-config
    literals:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/stingercheck
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATA_REDIS_HOST=redis
      - SERVER_FORWARD_HEADERS_STRATEGY=native
      - LOGGING_LEVEL_COM_STINGERCHECK=INFO
