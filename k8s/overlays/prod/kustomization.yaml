# The stinger-check-secrets Secret is created out of band (see README) and is
# deliberately not part of this overlay.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: stinger-check

resources:
  - ../../base
  - ingress.yaml

images:
  - name: ghcr.io/iamandresilva/stinger-check-api
    newTag: a4a5df732e4a7fc7b45e786b0cc31561c0872556
  - name: ghcr.io/iamandresilva/stinger-check-ui
    newTag: ac206f132fca7789bfd55a23e5f1a1c47277d103

configMapGenerator:
  - name: api-config
    behavior: merge
    literals:
      - APP_FRONTEND_URL=https://stingercheck.com
      - SERVER_SERVLET_SESSION_COOKIE_SECURE=true
