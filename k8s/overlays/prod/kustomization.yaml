# The stinger-check-secrets Secret is created out of band (see README) and is
# deliberately not part of this overlay.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: stinger-check

resources:
  - ../../base
  - ingress.yaml

images:
  - name: ghcr.io/iamandresilva/stinger-check-api
    newTag: c12b2c06ae3a85f7015b78b5d63eaced9745143d
  - name: ghcr.io/iamandresilva/stinger-check-ui
    newTag: af112af01bf905648741d62e83c0c0cc18abec33

configMapGenerator:
  - name: api-config
    behavior: merge
    literals:
      - APP_FRONTEND_URL=https://stingercheck.com
      - SERVER_SERVLET_SESSION_COOKIE_SECURE=true
