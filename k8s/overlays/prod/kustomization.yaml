# The stinger-check-secrets Secret is created out of band (see README) and is
# deliberately not part of this overlay.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: stinger-check

resources:
  - ../../base
  - ingress.yaml

images:
  - name: ghcr.io/iamandresilva/stinger-check-api
    newTag: 5cc37aea8393e54b0ec5db2afcabb988535205bd
  - name: ghcr.io/iamandresilva/stinger-check-ui
    newTag: 8e50ecb53f00df29d49594652010990428e10d17

configMapGenerator:
  - name: api-config
    behavior: merge
    literals:
      - APP_FRONTEND_URL=https://stingercheck.com
      - SERVER_SERVLET_SESSION_COOKIE_SECURE=true
