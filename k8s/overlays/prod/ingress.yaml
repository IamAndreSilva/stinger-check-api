# Per-IP rate limits (Traefik sees the client IP: externalTrafficPolicy Local, see k8s/cluster).
# A cache doesn't help against requests that never repeat (new search terms, new movie ids),
# so these cap what one IP can cost. Over the limit, Traefik answers 429.
#
# Every route: well above a person browsing, including a page's first load of scripts and styles.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit
spec:
  rateLimit:
    average: 20
    period: 1s
    burst: 100
---
# Routes that can make TMDB calls: the movie API and server-rendered movie pages (whose
# loaders call the API inside the cluster, past this ingress). About one request per page
# view or debounced keystroke, so this still leaves room for several people behind one IP.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit-movie-data
spec:
  rateLimit:
    average: 5
    period: 1s
    burst: 30
---
# Sign-in routes: starting a sign-in stores the OAuth request in a new session (about 3.5 KB),
# and a failed callback stores the error in one (about 9 KB). Sessions live 30 minutes in a
# capped Redis that refuses writes when full, so the general limit would let one IP fill it in
# minutes. One sign-in takes one request to each route.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit-sign-in
spec:
  rateLimit:
    average: 10
    period: 1m
    burst: 10
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stinger-check
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: stinger-check-rate-limit@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - stingercheck.com
        - www.stingercheck.com
      secretName: stinger-check-tls
  rules:
    - host: stingercheck.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: /sitemap.xml
            pathType: Exact
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ui
                port:
                  number: 80
---
# The movie-data routes with their tighter limit. Longer paths win over the ones above (Traefik
# orders routers by rule length), so these requests only pass rate-limit-movie-data.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stinger-check-movie-data
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: stinger-check-rate-limit-movie-data@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - stingercheck.com
      secretName: stinger-check-tls
  rules:
    - host: stingercheck.com
      http:
        paths:
          - path: /api/movies
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: /movies
            pathType: Prefix
            backend:
              service:
                name: ui
                port:
                  number: 80
---
# The sign-in routes with their tighter limit; like the movie-data paths, these longer paths win
# over /api above.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stinger-check-sign-in
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: stinger-check-rate-limit-sign-in@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - stingercheck.com
      secretName: stinger-check-tls
  rules:
    - host: stingercheck.com
      http:
        paths:
          - path: /api/oauth2/authorization
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: /api/login/oauth2/code
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: www-redirect
spec:
  redirectRegex:
    regex: ^https?://www\.stingercheck\.com/(.*)
    replacement: https://stingercheck.com/${1}
    permanent: true
---
# www only redirects to the apex domain; the backend is never reached.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stinger-check-www
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: stinger-check-www-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - www.stingercheck.com
      secretName: stinger-check-tls
  rules:
    - host: www.stingercheck.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ui
                port:
                  number: 80
