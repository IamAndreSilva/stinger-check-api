name: Uptime

# Checks the live site every 15 minutes. GitHub emails a failed scheduled run to whoever last
# changed the cron line below. Scheduled runs only use the default branch, can start a few
# minutes late, and stop after 60 days without repository activity.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions: {}

env:
  SITE: https://stingercheck.com
  # Fails on HTTP errors, retries blips so a single slow response doesn't raise an alert.
  CURL: curl --silent --show-error --fail --max-time 20 --retry 2 --retry-delay 10 --retry-all-errors

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check stingercheck.com
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Home page loads
        run: $CURL --output /dev/null "$SITE/"

      - name: Movie page loads
        run: $CURL --output /dev/null "$SITE/movies/1726-iron-man"

      # The API, Postgres, the cache and TMDB together: an empty list means movie data is down.
      - name: API lists movies in cinemas
        run: |
          count=$($CURL "$SITE/api/movies/now-playing" | jq 'length')
          echo "$count movies now playing"
          test "$count" -gt 0

      - name: API knows a movie
        run: |
          title=$($CURL "$SITE/api/movies/1726" | jq -r '.title')
          echo "Movie 1726 is $title"
          test "$title" = "Iron Man"

      # cert-manager renews 30 days ahead; two weeks left means renewal has been failing.
      - name: TLS certificate is valid for 14 more days
        run: |
          echo | openssl s_client -servername stingercheck.com -connect stingercheck.com:443 2>/dev/null \
            | openssl x509 -noout -enddate -checkend $((14 * 24 * 3600))
